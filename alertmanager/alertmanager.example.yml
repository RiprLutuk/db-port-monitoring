# Public template. Copy to alertmanager.yml and replace all example values locally.
global:
  resolve_timeout: 5m
  telegram_bot_token_file: /run/secrets/telegram_bot_token
  smtp_smarthost: "smtp.example.invalid:25"
  smtp_from: "alerts@example.invalid"
  smtp_require_tls: false

route:
  receiver: db-alerts
  group_by: [alertname, severity, category]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: db-alerts
    telegram_configs:
      - chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: |-
          {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }} | {{ .CommonLabels.alertname }}
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ end }}
    email_configs:
      - to: "oncall@example.invalid"
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - alertname="DBPortDown"
      - severity="critical"
    target_matchers:
      - alertname="DBPortProbeSlow"
      - severity="warning"
    equal: [instance]
