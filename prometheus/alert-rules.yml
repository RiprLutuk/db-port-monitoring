groups:
  - name: db-port-availability
    rules:
      - alert: DBPortDown
        expr: probe_success{job="db-port-availability", monitoring_excluded!="true"} == 0
        for: 10m
        labels:
          severity: critical
          category: database
          team: dba
        annotations:
          summary: "DB port down: {{ $labels.db_name }}"
          description: "Target {{ $labels.instance }} has been unreachable over TCP for more than 10 minutes. DB Type={{ $labels.db_type }}, Env={{ $labels.env }}."

      - alert: DBPortProbeSlow
        expr: probe_duration_seconds{job="db-port-availability", monitoring_excluded!="true"} > 3 and probe_success{job="db-port-availability", monitoring_excluded!="true"} == 1
        for: 10m
        labels:
          severity: warning
          category: database
          team: dba
        annotations:
          summary: "DB port probe slow: {{ $labels.db_name }}"
          description: "Target {{ $labels.instance }} TCP probe latency has exceeded 3 seconds for 10 minutes. DB Type={{ $labels.db_type }}, Env={{ $labels.env }}."

      - alert: DBPortProbeScrapeFailed
        expr: up{job="db-port-availability", monitoring_excluded!="true"} == 0
        for: 10m
        labels:
          severity: critical
          category: monitoring
          team: dba
        annotations:
          summary: "DB port probe scrape failed: {{ $labels.db_name }}"
          description: "Prometheus has failed to collect Blackbox results for {{ $labels.instance }} for more than 10 minutes."

      - alert: DBPortMetricsMissing
        expr: absent_over_time(probe_success{job="db-port-availability", monitoring_excluded!="true"}[10m])
        for: 5m
        labels:
          severity: critical
          category: monitoring
          team: dba
        annotations:
          summary: "All DB port probe metrics are missing"
          description: "All probe_success metrics have been unavailable for more than 10 minutes."

      - alert: BlackboxPGWriterDown
        expr: up{job="blackbox-pg-writer"} == 0
        for: 1m
        labels:
          severity: critical
          category: ingest
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL writer is down"
          description: "Prometheus has been unable to collect the blackbox-pg-writer health metric for more than 1 minute."

      - alert: BlackboxPGWriterCycleFailed
        expr: blackbox_pg_writer_cycle_success == 0
        for: 1m
        labels:
          severity: critical
          category: ingest
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL ingest is failing"
          description: "The PostgreSQL ingestion cycle has continuously failed for more than 1 minute."

      - alert: BlackboxPGWriterIngestStale
        expr: (time() - blackbox_pg_writer_last_success_timestamp_seconds > 600) and (blackbox_pg_writer_last_success_timestamp_seconds > 0)
        for: 1m
        labels:
          severity: critical
          category: ingest
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL ingest is stale"
          description: "The writer has not completed a successful ingestion for more than 10 minutes."

      - alert: BlackboxPGWriterBackfillBehind
        expr: blackbox_pg_writer_backfill_remaining_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: ingest
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL writer has a backfill backlog"
          description: "The PostgreSQL ingestion backlog has remained above 10 minutes for at least 5 minutes."

      - alert: BlackboxPGWriterProbeDataStale
        expr: blackbox_pg_writer_latest_probe_timestamp_seconds == 0 or time() - blackbox_pg_writer_latest_probe_timestamp_seconds > 900
        for: 1m
        labels:
          severity: critical
          category: ingest
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL probe data is stale"
          description: "The latest PostgreSQL probe sample is older than 15 minutes or has never been stored."

      - alert: BlackboxPGWriterTargetsMissing
        expr: blackbox_pg_writer_missing_recent_targets > 0
        for: 1m
        labels:
          severity: critical
          category: ingest
          team: dba
        annotations:
          summary: "Active DB targets are missing recent PostgreSQL samples"
          description: "{{ $value }} active targets have no PostgreSQL samples within the last 10 minutes."

      - alert: BlackboxPGWriterSourceGap
        expr: blackbox_pg_writer_empty_windows_last_cycle > 0
        for: 1m
        labels:
          severity: warning
          category: ingest
          team: dba
        annotations:
          summary: "Prometheus source window had no DB probe samples"
          description: "The writer skipped an empty source window without creating synthetic data. Check Prometheus and host resources."

      - alert: BlackboxPGWriterCycleSlow
        expr: blackbox_pg_writer_cycle_duration_seconds > blackbox_pg_writer_interval_seconds * 0.8
        for: 10m
        labels:
          severity: warning
          category: capacity
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL writer cycle is nearing its interval"
          description: "The writer cycle duration has used more than 80% of its interval for 10 minutes. Check PostgreSQL, target count, and backlog."

      - alert: BlackboxPGRawRetentionBehind
        expr: blackbox_pg_writer_raw_retention_overdue_seconds > 3600
        for: 15m
        labels:
          severity: warning
          category: capacity
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL raw retention is behind"
          description: "The oldest raw probe exceeds the retention limit by more than one hour. Cleanup is batch-limited; check the writer and autovacuum if the value keeps increasing."

      - alert: BlackboxPGRawTableLarge
        expr: blackbox_pg_writer_raw_table_bytes > 2147483648
        for: 1h
        labels:
          severity: warning
          category: capacity
          team: dba
        annotations:
          summary: "Blackbox PostgreSQL raw table exceeds 2 GiB"
          description: "The raw probe table and indexes exceed 2 GiB. Verify target count, 30-day retention, tablespace, and disk capacity."

      - alert: BlackboxPGDailyKPIMissing
        expr: blackbox_pg_writer_yesterday_missing_kpi_targets > 0
        for: 30m
        labels:
          severity: critical
          category: data-quality
          team: dba
        annotations:
          summary: "Daily DB-port KPI is missing targets"
          description: "{{ $value }} active non-excluded targets have no daily KPI for yesterday. Check the writer, source gaps, and aggregation process."

      - alert: BlackboxPGDailyKPIPartial
        expr: blackbox_pg_writer_yesterday_partial_kpi_targets > 0
        for: 30m
        labels:
          severity: warning
          category: data-quality
          team: dba
        annotations:
          summary: "Daily DB-port KPI has incomplete targets"
          description: "{{ $value }} active non-excluded targets do not have all 288 five-minute probes in yesterday's daily KPI."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
          category: alerting
          team: dba
        annotations:
          summary: "Alertmanager is unavailable"
          description: "Prometheus has been unable to reach Alertmanager for more than 1 minute; Telegram notifications may not be delivered."

      - alert: AlertmanagerTelegramDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total{integration="telegram"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          category: alerting
          team: dba
        annotations:
          summary: "Telegram alert delivery failed"
          description: "Alertmanager recorded a Telegram delivery failure within the last 15 minutes. Check the token, chat ID, connectivity, and Alertmanager logs."

      - alert: AlertmanagerEmailDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total{integration="email"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          category: alerting
          team: dba
        annotations:
          summary: "Email alert delivery failed"
          description: "Alertmanager recorded an email delivery failure within the last 15 minutes. Check the SMTP relay, recipient addresses, connectivity, and Alertmanager logs."
